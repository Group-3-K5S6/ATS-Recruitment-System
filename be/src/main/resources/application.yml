server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: ats-backend
  datasource:
    url: jdbc:h2:file:./data/ats;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZS1tZS0zMi1ieXRlcw==}
    expiration-ms: 86400000
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  seed:
    enabled: ${SEED_DEMO_USER:true}
    email: ${SEED_USER_EMAIL:admin@ats.local}
    password: ${SEED_USER_PASSWORD:Admin@12345}
